<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="150" rx="5" fill="#F5F7FA"/>
  
  <!-- Card with tabs -->
  <rect x="20" y="20" width="160" height="110" rx="5" fill="#FFFFFF" stroke="#E5E7EB"/>
  
  <!-- Tab bar -->
  <rect x="20" y="20" width="160" height="30" rx="5 5 0 0" fill="#60A5FA"/>
  
  <!-- Tab buttons -->
  <rect x="30" y="28" width="30" height="14" rx="2" fill="#F9FAFB"/>
  <rect x="70" y="28" width="30" height="14" rx="2" fill="#F9FAFB"/>
  <rect x="110" y="28" width="30" height="14" rx="2" fill="#F9FAFB"/>
  
  <!-- Content area left -->
  <rect x="30" y="60" width="60" height="60" rx="2" fill="#F3F4F6"/>
  <rect x="40" y="70" width="40" height="5" rx="1" fill="#9CA3AF"/>
  <rect x="40" y="80" width="40" height="5" rx="1" fill="#9CA3AF"/>
  <rect x="40" y="90" width="40" height="5" rx="1" fill="#9CA3AF"/>
  <rect x="40" y="105" width="30" height="8" rx="2" fill="#10B981"/>
  
  <!-- Content area right -->
  <rect x="110" y="60" width="60" height="60" rx="2" fill="#F3F4F6"/>
  <rect x="120" y="70" width="40" height="5" rx="1" fill="#9CA3AF"/>
  <rect x="120" y="80" width="40" height="5" rx="1" fill="#9CA3AF"/>
  <rect x="120" y="90" width="40" height="5" rx="1" fill="#9CA3AF"/>
  <rect x="120" y="105" width="30" height="8" rx="2" fill="#10B981"/>

  <!-- Accent elements -->
  <circle cx="25" cy="35" r="5" fill="#EF4444"/>
  <rect x="175" cy="35" width="10" height="10" rx="2" fill="#F59E0B"/>
  <circle cx="175" cy="35" r="5" fill="#8B5CF6"/>
</svg>