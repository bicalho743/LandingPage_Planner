<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="150" rx="5" fill="#F5F7FA"/>
  
  <!-- Settings panel container -->
  <rect x="20" y="20" width="160" height="110" rx="5" fill="#FFFFFF" stroke="#E5E7EB"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="160" height="25" rx="5 5 0 0" fill="#8B5CF6"/>
  <rect x="30" y="28" width="80" height="8" rx="1" fill="#F9FAFB"/>
  
  <!-- Main settings area -->
  <rect x="30" y="55" width="140" height="65" rx="2" fill="#F3F4F6"/>
  
  <!-- Color dots/selectors -->
  <circle cx="45" cy="70" r="5" fill="#60A5FA"/>
  <circle cx="45" cy="90" r="5" fill="#10B981"/>
  <circle cx="45" cy="110" r="5" fill="#F59E0B"/>
  
  <!-- Category labels -->
  <rect x="60" cy="70" width="50" height="6" rx="1" fill="#4B5563"/>
  <rect x="60" cy="90" width="50" height="6" rx="1" fill="#4B5563"/>
  <rect x="60" cy="110" width="50" height="6" rx="1" fill="#4B5563"/>
  
  <!-- Settings controls -->
  <rect x="120" y="65" width="40" height="15" rx="3" fill="#60A5FA"/>
  <rect x="120" y="85" width="40" height="15" rx="3" fill="#10B981"/>
  <rect x="120" y="105" width="40" height="15" rx="3" fill="#8B5CF6"/>
  
  <!-- Toggle indicators -->
  <circle cx="130" cy="73" r="5" fill="#FFFFFF"/>
  <circle cx="150" cy="93" r="5" fill="#FFFFFF"/>
  <circle cx="140" cy="113" r="5" fill="#FFFFFF"/>
</svg>